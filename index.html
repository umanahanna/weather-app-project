<DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <title>My weather application</title>
  </head>
  <div class="weather-app">
  <body>
    <header>
      <form id="search-form" >
        <input class="search-input"   type="search" placeholder="Enter a city.." required autofocus  id="search-input"/>
        <input class="submit" type="submit" value="Search" />
      </form>
    </header>
    <main>
      <div class="weather-app-data">
        <div>
          <h1 class="weather-app-city" id="current-city">Paris</h1>
          
          <p class="weather-app-details"><span id="current-date"> </span> <span id="description">,   moderate rain </span><br/>
            
          Humidity: <strong id="humidity"></strong>, Wind: <strong id="windspeed"></strong>            
          </p>
        </div>
        <div class="weather-app-temperature-container">
          <div id="icon"></div>
           <span class="weather-app-temperature" id="current-temperature"></span>
           <span class="weather-app-unit"> °C</span></div>
      </div>
      
       <div class="weather-forecast" id="forecast">

<div class="weather-forecast-day">
      <div class="weather-forecast-date">Tues</div>
      <div class="weather-forecast-icon">⛅</div>
<div class="weather-forecast-temperatures">
      <div class="weather-forecast-temperature">15°</div>
      <div class="weather-forecast-temperature">
        <strong>9°</strong> </div>
        </div>
      </div>

<div class="weather-forecast-day">
      <div class="weather-forecast-date">Wed</div>
      <div class="weather-forecast-icon">⛅</div>
<div class="weather-forecast-temperatures">
      <div class="weather-forecast-temperature">15°</div>
      <div class="weather-forecast-temperature">
        <strong>9°</strong> </div>
        </div>
</div>

<div class="weather-forecast-day">
      <div class="weather-forecast-date">Thurs</div>
      <div class="weather-forecast-icon">⛅</div>
<div class="weather-forecast-temperatures">
      <div class="weather-forecast-temperature">15°</div>
      <div class="weather-forecast-temperature">
        <strong>9°</strong> </div>
        </div>
</div>

<div class="weather-forecast-day">
      <div class="weather-forecast-date">Fri</div>
      <div class="weather-forecast-icon">⛅</div>
<div class="weather-forecast-temperatures">
      <div class="weather-forecast-temperature">15°</div>
      <div class="weather-forecast-temperature">
        <strong>9°</strong> </div>
        </div>
</div>
<div class="weather-forecast-day">
      <div class="weather-forecast-date">Sat</div>
      <div class="weather-forecast-icon">⛅</div>
<div class="weather-forecast-temperatures">
      <div class="weather-forecast-temperature">15°</div>
      <div class="weather-forecast-temperature">
        <strong>9°</strong> </div>
        </div>
</div>








       </div>
      
    </main>
    <footer>
      <p>
        This project was coded by
        <a href="https://github.com/umanahanna" target="_blank">Hannah Umana</a> and is
     <a href="https://github.com/umanahanna/weather-app-project" target="_blank">  on GitHub </a> and  
        <a href="#" target="_blank"> hosted on Render</a>
      </p>
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
