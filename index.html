<DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <title>My weather application</title>
  </head>
  <div class="weather-app">
  <body>
    <header>
      <form id="search-form" class="search-form" >
        <input  type="search" placeholder="Enter a city.." required autofocus  class="search-form-input" id="search-form-input"/>
        <input  type="submit" value="Search" class="search-submit-button" />
      </form>
    </header>
    <main>
      <div class="weather-app-data">
        <div>
          <h1 class="weather-app-city" id="city">Paris</h1>
          
          <p class="weather-app-details"><span id="time"> </span> <span id="description"></span>,   moderate rain </span><br/>
            
          Humidity: <strong id="humidity"></strong>, Wind: <strong id="wind-speed"></strong>            
          </p>
        </div>
        <div class="weather-app-temperature-container">
          <div id="weather-app-icon"></div>
           <div class="weather-app-temperature" id="temperature"></div>
           <div class="weather-app-unit">°C</div>
        </div>
      </div>
      
    
      
       <div class="weather-forecast" id="forecast"> </div> 
    </main>
    <footer>
      <p>
        This project was coded by
        <a href="https://github.com/umanahanna" target="_blank">Hannah Umana</a> and is
     <a href="https://github.com/umanahanna/weather-app-project" target="_blank">  on GitHub </a> and  
        <a href="#" target="_blank"> hosted on Render</a>
      </p>
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
